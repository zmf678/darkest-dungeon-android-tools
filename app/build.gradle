plugins {
    id 'com.android.application'
}

android {
    namespace 'dev.torcharchive.dd'
    compileSdk 36

    defaultConfig {
        def lab = providers.gradleProperty('archiveLab').map { it.toBoolean() }.getOrElse(false)
        applicationId lab ? 'dev.torcharchive.dd.lab' : 'dev.torcharchive.dd'
        minSdk 30
        targetSdk 36
        versionCode 3
        versionName '1.2.0'
        manifestPlaceholders = [archiveLabel: lab ? '余烬档案馆 · 实验版' : '余烬档案馆']
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
