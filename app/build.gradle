plugins {
    id 'com.android.application'
}

android {
    namespace 'dev.torcharchive.dd'
    compileSdk 36

    defaultConfig {
        def lab = providers.gradleProperty('archiveLab').map { it.toBoolean() }.getOrElse(false)
        applicationId lab ? 'dev.torcharchive.ddgame.lab' : 'dev.torcharchive.ddgame'
        minSdk 26
        targetSdk 36
        versionCode 41
        versionName '2.3.0'
        manifestPlaceholders = [archiveLabel: lab ? '暗黑地牢 · 余烬启动器(测试)' : '暗黑地牢 · 余烬启动器']
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        disable 'MissingClass'
    }
}
